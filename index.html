<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Member Portal</title>
<style>:root{--ink:#12263a;--mute:#5d6f82;--navy:#0b3a82;--navy2:#14305a;--teal:#0b4aa8;--bg:#eef2f8;--card:#fff;--line:#dbe3ee;--red:#c2410c;--green:#15803d;--soft:#f3f6fb;--shadow:0 2px 10px rgba(16,42,67,.08)}
@media (prefers-color-scheme:dark){:root{--ink:#e6eef7;--mute:#9db0c4;--navy:#0a2a5e;--navy2:#0b1f44;--teal:#5b9bff;--bg:#0c1624;--card:#14233a;--line:#26395a;--red:#ff9a62;--green:#6ee7a0;--soft:#1a2c47;--shadow:0 2px 12px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Ethiopic",sans-serif}
.hdr{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;border-bottom:3px solid #e0a82e}
.hdr .in{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.org{font-weight:700;font-size:14px;line-height:1.3;display:flex;align-items:center;gap:10px}
.org .lg{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid #e0a82e}.lgb{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;display:block;box-shadow:0 3px 12px rgba(16,42,67,.2)}
.lang{white-space:nowrap;display:flex;gap:4px;background:rgba(255,255,255,.14);padding:3px;border-radius:20px}
.lang button{border:0;background:transparent;color:#fff;border-radius:16px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.lang button.on{background:#fff;color:var(--navy)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{display:block}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 .ic{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:15px}
label{display:block;font-size:14px;color:var(--mute);margin:14px 0 5px;font-weight:600}
input{width:100%;font:inherit;font-size:18px;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink)}
input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(11,74,168,.15)}
#login{max-width:420px;margin:18px auto;padding:24px 20px;text-align:center}
#login .lk{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto 10px}
#login label{text-align:left}
.go{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 4px 12px rgba(11,74,168,.3)}
.go:disabled{opacity:.6}
.err{color:var(--red);min-height:22px;margin-top:10px;font-size:14px}
.note{color:var(--mute);font-size:13px}
.hero{background:linear-gradient(135deg,var(--navy2),var(--navy) 60%,var(--teal));color:#fff;border:0;padding:18px}
.hero .who{display:flex;align-items:center;gap:12px}
.av{flex:none;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid #e0a82e;display:grid;place-items:center;font-size:22px;font-weight:700}
.hero h1{color:#fff;font-size:19px}.hero .note{color:rgba(255,255,255,.8)}
.hero .big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.hero .big div{background:rgba(255,255,255,.12);border-radius:12px;padding:11px 12px}
.hero .big span{display:block;font-size:12px;color:rgba(255,255,255,.8)}
.hero .big b{font-size:20px;font-variant-numeric:tabular-nums}
.hero .big .dn{color:#ffd0a8}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--soft);border-radius:12px;padding:12px;border-left:4px solid var(--teal)}.k.g{border-color:var(--green)}.k.r{border-color:var(--red)}.k.y{border-color:#e0a82e}
.k span{display:block;font-size:12px;color:var(--mute)}.k b{font-size:19px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}
.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--soft);border-radius:12px;margin-top:8px}
.acct b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--green)}
.lnh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:3px 11px;background:#fde8d4;color:#9a3412}
.nxt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;padding:11px 12px;border-radius:12px;background:linear-gradient(135deg,#fff7e0,#fdecc0);color:#6b4700;border:1px solid #f0c872}
.nxt b{font-size:16px;font-variant-numeric:tabular-nums}
details{margin-top:8px}summary{cursor:pointer;color:var(--teal);font-weight:700;font-size:14px;padding:8px 0;list-style:none}
summary::-webkit-details-marker{display:none}summary::before{content:"▸ ";}details[open]>summary::before{content:"▾ "}
.tw{overflow-x:auto;margin-top:6px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr:nth-child(even){background:var(--soft)}tbody tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--mute);position:sticky;top:0;background:var(--soft)}
td.l,th.l{text-align:left;white-space:normal;min-width:110px}
.pill{display:inline-block;font-size:12px;border-radius:20px;padding:2px 9px;background:var(--soft);color:var(--mute)}
.bad{color:var(--red)}.ok{color:var(--green)}
.hide{display:none}
.acts{display:flex;gap:10px;justify-content:center;margin:6px 0 20px}
@media (max-width:420px){.hero .big b{font-size:17px}.org{font-size:12.5px}}
@media print{.noprint{display:none!important}.hdr{display:none}body{background:#fff;color:#000}.card{border:1px solid #999;box-shadow:none;break-inside:avoid}.hero{background:#fff;color:#000;border:1px solid #999}.hero h1,.hero .note,.hero .big span,.hero .big b{color:#000}details{display:block}details>*{display:block}}
</style>
</head>

function t(k){return T[L][k]}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function f(n){n=+n||0;return Math.abs(n)<0.005?"-":n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function kn(k,fb){return T[L].k[k]||fb||k}
function setL(l){L=l;try{localStorage.setItem("mp_lang",l)}catch(e){}paint();if(DATA)render()}
function paint(){
  document.documentElement.lang=L;
  document.getElementById("org").textContent=t("org");document.getElementById("t_login").textContent=t("login");document.getElementById("t_login_n").textContent=t("loginN");
  document.getElementById("t_acc").textContent=t("acc");document.getElementById("t_pin").textContent=t("pin");document.getElementById("gob").textContent=t("go");
  document.getElementById("l_am").className=L=="am"?"on":"";document.getElementById("l_en").className=L=="en"?"on":"";document.title=t("login")}
function doLogin(){
  var a=document.getElementById("acc").value.trim(),p=document.getElementById("pin").value.trim(),e=document.getElementById("err"),b=document.getElementById("gob");
  e.textContent="";if(!a||!p){e.textContent=t("empty");return}
  if(!sb){if(typeof supabase==="undefined"){e.textContent=t("net");return}sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}})}
  b.disabled=true;b.textContent=t("wait");
  sb.rpc("member_login",{p_acc:a,p_pin:p}).then(function(r){
    b.disabled=false;b.textContent=t("go");
    if(r.error||!r.data){e.textContent=t("net");return}
    var d=r.data;if(!d.ok){e.textContent=d.err=="locked"?t("locked"):t("invalid");document.getElementById("pin").value="";return}
    if(!d.data){e.textContent=t("nodata");return}
    DATA=d.data;UPD=d.updated;CRED={a:a,p:p};startPoll();document.getElementById("pin").value="";document.getElementById("acc").value="";
    document.getElementById("login").className="card hide";document.getElementById("view").className="";render();arm();window.scrollTo(0,0)
  }).catch(function(){b.disabled=false;b.textContent=t("go");e.textContent=t("net")})}
function startPoll(){clearInterval(POLL);POLL=setInterval(refresh,15000)}
function refresh(){if(!DATA||!CRED||!sb||document.hidden)return;
  sb.rpc("member_login",{p_acc:CRED.a,p_pin:CRED.p}).then(function(r){if(!DATA||r.error||!r.data||!r.data.ok||!r.data.data)return;
    if(String(r.data.updated)!==String(UPD)){var y=window.pageYOffset;DATA=r.data.data;UPD=r.data.updated;render();window.scrollTo(0,y)}}).catch(function(){})}
document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh()});
function arm(){clearTimeout(idle);idle=setTimeout(function(){logout(t("idle"))},5*60*1000)}
["click","keydown","touchstart","scroll"].forEach(function(ev){document.addEventListener(ev,function(){if(DATA)arm()},{passive:true})});
function logout(msg){DATA=null;UPD=null;CRED=null;clearInterval(POLL);clearTimeout(idle);document.getElementById("view").className="hide";document.getElementById("view").innerHTML="";document.getElementById("login").className="card";document.getElementById("err").textContent=msg||""}
function stTable(rows,more){
  if(!rows||!rows.length)return'<p class="note">'+t("none")+'</p>';
  return'<div class="tw"><table><thead><tr><th class="l">'+t("date")+'</th><th class="l">'+t("desc")+'</th><th>'+t("inn")+'</th><th>'+t("out")+'</th><th>'+t("balc")+'</th></tr></thead><tbody>'+rows.map(function(x){return'<tr><td class="l">'+esc(x.d)+'</td><td class="l">'+esc(x.t)+(x.i?' <span class="pill">'+t("interest")+'</span>':"")+'</td><td>'+f(x["in"])+'</td><td>'+f(x.out)+'</td><td><b>'+f(x.b)+'</b></td></tr>'}).join("")+'</tbody></table></div>'+(more>0?'<p class="note">'+t("more").replace("{n}",more)+'</p>':"")}
function lnTable(rows,more){
  if(!rows||!rows.length)return'<p class="note">'+t("none")+'</p>';
  return'<div class="tw"><table><thead><tr><th class="l">'+t("date")+'</th><th class="l">'+t("desc")+'</th><th>'+t("dis")+'</th><th>'+t("pr")+'</th><th>'+t("it")+'</th><th>'+t("pn")+'</th><th>'+t("balc")+'</th></tr></thead><tbody>'+rows.map(function(x){return'<tr><td class="l">'+esc(x.d)+'</td><td class="l">'+esc(x.t)+'</td><td>'+f(x.dis)+'</td><td>'+f(x.pr)+'</td><td>'+f(x.it)+'</td><td>'+f(x.pn)+'</td><td><b>'+f(x.b)+'</b></td></tr>'}).join("")+'</tbody></table></div>'+(more>0?'<p class="note">'+t("more").replace("{n}",more)+'</p>':"")}
function render(){
  var d=DATA,sv=d.sv||[],ln=d.ln||[],ts=0,tl=0,ti=0,tp=0;
  sv.forEach(function(a){ts+=a.bal});ln.forEach(function(a){tl+=a.bal;ti+=a.ir;tp+=a.pen});
  var ini=String(d.name||"?").trim().charAt(0);
  var h='<div class="card hero"><div class="who"><div class="av">'+esc(ini)+'</div><div><h1>'+t("hi")+', '+esc(d.name)+'</h1><div class="note">'+t("acc")+': <b>'+esc(d.acc)+'</b></div></div></div><div class="big"><div><span>💰 '+t("sav")+'</span><b>'+f(ts)+'</b></div><div><span>🏦 '+t("lnb")+'</span><b'+(tl>0?' class="dn"':"")+'>'+f(tl)+'</b></div></div><div class="note" style="margin-top:10px">'+t("asof")+' '+esc(d.asof)+' '+t("ec")+(UPD?' · '+t("upd")+': '+esc(new Date(UPD).toLocaleDateString("en-GB")):"")+'</div></div>';
  h+='<div class="card"><h2><span class="ic">📊</span>'+t("sum")+'</h2><div class="kp"><div class="k g"><span>'+t("sav")+'</span><b>'+f(ts)+'</b></div><div class="k r"><span>'+t("lnb")+'</span><b'+(tl>0?' class="bad"':"")+'>'+f(tl)+'</b></div><div class="k y"><span>'+t("ir")+'</span><b>'+f(ti)+'</b></div><div class="k"><span>'+t("pen")+'</span><b>'+f(tp)+'</b></div></div></div>';
  h+='<div class="card"><h2><span class="ic">💰</span>'+t("savT")+'</h2>'+(sv.length?sv.map(function(a){return'<div class="acct"><span>'+esc(kn(a.k,a.n))+'</span><b>'+f(a.bal)+'</b></div><details><summary>'+t("stmt")+'</summary>'+stTable(a.tx,a.more)+'</details>'}).join(""):'<p class="note">'+t("noSav")+'</p>')+'</div>';
  h+='<div class="card"><h2><span class="ic">🏦</span>'+t("lnT")+'</h2>'+(ln.length?ln.map(function(a,ix){
    var nx=a.next?'<div class="nxt"><span>📅 '+t("next")+'</span><b>'+f(a.next.pr+a.next.it)+' '+t("nextD")+' '+esc(a.next.d)+'</b></div>':"";
    return'<div style="'+(ix?"margin-top:16px;padding-top:12px;border-top:2px solid var(--line)":"")+'"><div class="lnh"><b>'+esc(kn(a.k,a.n))+'</b><span class="chip">'+t("loan")+' '+esc(a.no)+'</span></div>'+
      '<div class="row"><span>'+t("bal")+'</span><b>'+f(a.bal)+'</b></div>'+(a.amt?'<div class="row"><span>'+t("amt")+'</span><b>'+f(a.amt)+'</b></div>':"")+(a.od?'<div class="row"><span>'+t("given")+'</span><b>'+esc(a.od)+'</b></div>':"")+
      '<div class="row"><span>'+t("rate")+'</span><b>'+esc(a.rate)+'%</b></div><div class="row"><span>'+t("ir")+'</span><b>'+f(a.ir)+'</b></div><div class="row"><span>'+t("pen")+'</span><b>'+f(a.pen)+'</b></div>'+(a.mat?'<div class="row"><span>'+t("mat")+'</span><b>'+esc(a.mat)+'</b></div>':"")+nx+
      (a.sched&&a.sched.length?'<details><summary>'+t("sched")+'</summary><div class="tw"><table><thead><tr><th>'+t("no")+'</th><th class="l">'+t("date")+'</th><th>'+t("pr")+'</th><th>'+t("it")+'</th><th>'+t("st")+'</th></tr></thead><tbody>'+a.sched.map(function(x){return'<tr><td>'+x.i+'</td><td class="l">'+esc(x.d)+'</td><td>'+f(x.pr)+'</td><td>'+f(x.it)+'</td><td>'+(x.paid?'<span class="ok">'+t("paid")+'</span>':(x.late>0?'<span class="bad">'+t("late")+' ('+x.late+')</span>':t("due")))+'</td></tr>'}).join("")+'</tbody></table></div></details>':"")+
      '<details><summary>'+t("hist")+'</summary>'+lnTable(a.tx,a.more)+'</details></div>'}).join(""):'<p class="note">'+t("noLn")+'</p>')+'</div>';
  h+='<div class="note" style="margin:10px 4px">'+t("foot")+'</div><div class="acts noprint"><button class="btn" onclick="window.print()">'+t("print")+'</button><button class="btn" onclick="logout()">'+t("out2")+'</button></div>';
  document.getElementById("view").innerHTML=h}
try{var sl=localStorage.getItem("mp_lang");if(sl==="en"||sl==="am")L=sl}catch(e){}
paint();
</script>
